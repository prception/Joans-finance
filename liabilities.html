<!doctype html>
<html lang="en" data-page="liabilities">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liabilities · Johaan's Future</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-900">
<div id="sidebar-root"></div>
<div id="topbar-root"></div>

<main id="page" class="lg:pl-64 pt-16 min-h-screen">
  <div class="p-4 lg:p-8 space-y-6 max-w-6xl mx-auto">

    <div class="flex items-center justify-between flex-wrap gap-3">
      <div>
        <h1 class="text-xl font-semibold">Liabilities</h1>
        <p class="text-sm text-slate-500">Loans, credit cards and other borrowings — optionally linked to the asset they financed.</p>
      </div>
      <button data-requires="manage_liabilities" onclick="App.openModal('modal-add-liability')" class="inline-flex items-center gap-2 bg-teal-700 hover:bg-teal-800 text-white text-sm font-medium rounded-lg px-4 py-2.5">+ Add Liability</button>
    </div>

    <div id="summary-cards" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>

    <div class="card p-4 flex items-center gap-3 flex-wrap">
      <input id="search" placeholder="Search liabilities..." class="border border-slate-200 rounded-lg px-3 py-2 text-sm w-full max-w-xs outline-none focus:ring-2 focus:ring-teal-600/30" />
      <select id="filter-type" class="border border-slate-200 rounded-lg px-3 py-2 text-sm"><option value="">All types</option></select>
      <select id="filter-currency" class="border border-slate-200 rounded-lg px-3 py-2 text-sm"><option value="">All currencies</option></select>
      <select id="filter-status" class="border border-slate-200 rounded-lg px-3 py-2 text-sm"><option value="">Any status</option><option value="active">Active</option><option value="closed">Closed</option></select>
    </div>

    <div class="space-y-3" id="liability-list"></div>
  </div>
</main>

<div id="modal-add-liability" data-modal class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop bg-slate-900/30 p-4 overflow-y-auto">
  <div class="card w-full max-w-lg p-6 my-8">
    <div class="flex items-center justify-between mb-4"><h2 class="text-base font-semibold">Add Liability</h2><button onclick="App.closeModal('modal-add-liability')" class="text-slate-400">✕</button></div>
    <form data-mock-form="Liability saved (prototype)." class="grid grid-cols-2 gap-4">
      <label class="col-span-2 text-sm">Liability Name<input required class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" /></label>
      <label class="text-sm">Type<select class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"><option>Property Loan</option><option>Vehicle Loan</option><option>Personal Loan</option><option>Business Loan</option><option>Credit Card</option><option>Other</option></select></label>
      <label class="text-sm">Lender<input class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" /></label>
      <label class="text-sm">Country<select data-options="country" data-value="AE" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"></select></label>
      <label class="text-sm">Currency<select data-options="currency" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"></select></label>
      <label class="text-sm">Original Amount<input type="number" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" /></label>
      <label class="text-sm">Outstanding Amount<input type="number" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" /></label>
      <label class="text-sm">Interest Rate (%)<input type="number" step="any" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" /></label>
      <label class="text-sm">EMI<input type="number" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" /></label>
      <label class="text-sm">Payment Frequency<select class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"><option>Monthly</option><option>Quarterly</option><option>Yearly</option><option>Other</option></select></label>
      <label class="text-sm">Start Date<input type="date" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" /></label>
      <label class="text-sm">Maturity Date<input type="date" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" /></label>
      <label class="text-sm">Status<select class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"><option>Active</option><option>Closed</option></select></label>
      <label class="col-span-2 text-sm">Linked Asset (optional)
        <select id="asset-select" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"><option>— None —</option></select>
      </label>
      <label class="col-span-2 text-sm">Notes<textarea rows="2" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"></textarea></label>
      <div class="col-span-2 flex justify-end gap-2 pt-2">
        <button type="button" onclick="App.closeModal('modal-add-liability')" class="px-4 py-2 text-sm rounded-lg border border-slate-200">Cancel</button>
        <button class="px-4 py-2 text-sm rounded-lg bg-teal-700 text-white font-medium">Save Liability</button>
      </div>
    </form>
  </div>
</div>

<div id="modal-payment" data-modal class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop bg-slate-900/30 p-4">
  <div class="card w-full max-w-md p-6">
    <div class="flex items-center justify-between mb-4"><h2 class="text-base font-semibold">Record Payment</h2><button onclick="App.closeModal('modal-payment')" class="text-slate-400">✕</button></div>
    <form data-mock-form="Payment recorded — outstanding principal reduced (prototype)." class="grid grid-cols-2 gap-4">
      <label class="col-span-2 text-sm">Liability<select id="pay-liability" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"></select></label>
      <label class="text-sm">Date<input type="date" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" /></label>
      <label class="text-sm">Paid From<select id="pay-account" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"></select></label>
      <label class="text-sm">Principal<input type="number" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" /></label>
      <label class="text-sm">Interest<input type="number" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" /></label>
      <p class="col-span-2 text-xs text-slate-400">Only the principal reduces the outstanding balance. Interest is recorded as an expense. Recurring EMIs can be set up under Reminders → Recurring as a Loan Payment.</p>
      <div class="col-span-2 flex justify-end gap-2 pt-2">
        <button type="button" onclick="App.closeModal('modal-payment')" class="px-4 py-2 text-sm rounded-lg border border-slate-200">Cancel</button>
        <button class="px-4 py-2 text-sm rounded-lg bg-teal-700 text-white font-medium">Save Payment</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  App.injectShell("liabilities");
  document.getElementById("asset-select").innerHTML += MOCK.investments.filter(i => i.status !== "sold").map(i => `<option>${i.name}</option>`).join("");
  document.getElementById("pay-liability").innerHTML = MOCK.liabilities.map(l => `<option value="${l.id}">${l.name}</option>`).join("");
  document.getElementById("pay-account").innerHTML = MOCK.accounts.map(a => `<option>${a.name}</option>`).join("");

  const totalOutstanding = MOCK.liabilities.reduce((s, l) => s + toBase(l.outstanding, l.currency), 0);
  const totalOriginal = MOCK.liabilities.filter(l => l.original).reduce((s, l) => s + toBase(l.original, l.currency), 0);
  const totalEmi = MOCK.liabilities.filter(l => l.emi).reduce((s, l) => s + toBase(l.emi, l.currency), 0);

  App.renderCards(document.getElementById("summary-cards"), [
    { label: "Total Outstanding", value: App.fmtMoney(totalOutstanding), subTone: "red" },
    { label: "Total Original Borrowed", value: App.fmtMoney(totalOriginal) },
    { label: "Combined Monthly EMI", value: App.fmtMoney(totalEmi) },
    { label: "Active Liabilities", value: MOCK.liabilities.filter(l => l.status === "active").length },
  ]);

  const months = (from, to) => { const a = new Date(from), b = new Date(to); return (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth(); };
  // Total interest over the loan's life, from its EMI schedule: EMI × number of payments − amount borrowed (SRS §32).
  const lifetimeInterest = l => l.emi && l.original && l.start && l.maturity ? l.emi * months(l.start, l.maturity) - l.original : null;

  function openPayment(id) {
    document.getElementById("pay-liability").value = id;
    App.openModal("modal-payment");
  }

  const uniq = key => [...new Set(MOCK.liabilities.map(l => l[key]))];
  document.getElementById("filter-type").innerHTML += uniq("type").map(v => `<option>${v}</option>`).join("");
  document.getElementById("filter-currency").innerHTML += uniq("currency").map(v => `<option>${v}</option>`).join("");

  function render() {
    const f = id => document.getElementById(id).value;
    const q = f("search").toLowerCase();
    const rows = MOCK.liabilities.filter(l =>
      (!f("filter-type") || l.type === f("filter-type")) && (!f("filter-currency") || l.currency === f("filter-currency")) &&
      (!f("filter-status") || l.status === f("filter-status")) && (!q || `${l.name} ${l.lender} ${l.type}`.toLowerCase().includes(q)));
    document.getElementById("liability-list").innerHTML = rows.length ? rows.map(l => {
    const linked = l.linkedAsset ? MOCK.investments.find(i => i.id === l.linkedAsset) : null;
    const paidPct = l.original ? Math.round(((l.original - l.outstanding) / l.original) * 100) : null;
    const lifeInt = lifetimeInterest(l);
    return `
    <div class="card p-5">
      <div class="flex items-start justify-between flex-wrap gap-4">
        <div>
          <div class="flex items-center gap-2">
            <p class="font-semibold text-slate-800">${l.name}</p>
            ${App.badge(l.type, "slate")}
            ${App.badge(l.status === "active" ? "Active" : "Closed", l.status === "active" ? "green" : "slate")}
          </div>
          <p class="text-xs text-slate-400 mt-1">${l.lender}${linked ? ` · Linked to <a href="investment-detail.html?id=${linked.id}" class="text-teal-700">${linked.name}</a>` : ""}</p>
        </div>
        <div class="text-right">
          <p class="text-lg font-semibold text-rose-600">${App.fmtMoney(l.outstanding, l.currency)}</p>
          <p class="text-xs text-slate-400">outstanding${l.original ? ` of ${App.fmtMoney(l.original, l.currency)}` : ""}</p>
        </div>
      </div>
      ${paidPct !== null ? `
      <div class="mt-4">
        <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-teal-600" style="width:${paidPct}%"></div></div>
        <p class="text-[11px] text-slate-400 mt-1">${paidPct}% repaid</p>
      </div>` : ""}
      <div class="mt-4 grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3 text-xs">
        <div><p class="text-slate-400">Interest Rate</p><p class="font-medium text-slate-700">${l.rate}%</p></div>
        <div><p class="text-slate-400">EMI</p><p class="font-medium text-slate-700">${l.emi ? App.fmtMoney(l.emi, l.currency) : "—"}</p></div>
        <div><p class="text-slate-400">Frequency</p><p class="font-medium text-slate-700">${l.frequency || "—"}</p></div>
        <div><p class="text-slate-400">Next Payment</p><p class="font-medium text-slate-700">${App.fmtDate(l.nextDue)}</p></div>
        <div><p class="text-slate-400">Start Date</p><p class="font-medium text-slate-700">${App.fmtDate(l.start)}</p></div>
        <div><p class="text-slate-400">Maturity</p><p class="font-medium text-slate-700">${App.fmtDate(l.maturity)}</p></div>
        <div><p class="text-slate-400">Total Interest (loan life, est.)</p><p class="font-medium text-slate-700">${lifeInt !== null ? App.fmtMoney(lifeInt, l.currency) : "—"}</p></div>
      </div>
      ${l.notes ? `<p class="mt-3 text-xs text-slate-500">${l.notes}</p>` : ""}
      ${paymentHistory(l)}
      <div class="mt-4 flex items-center justify-between">
        <button data-requires="manage_liabilities" onclick="openPayment('${l.id}')" class="text-xs font-medium text-teal-700">+ Record Payment</button>
        ${App.rowActions("manage_liabilities", "liability")}
      </div>
    </div>`;
  }).join("") : '<div class="card p-10 text-center text-sm text-slate-400">No liabilities match these filters.</div>';
    App.applyPermissionGating();
  }
  render();
  ["filter-type", "filter-currency", "filter-status"].forEach(id => document.getElementById(id).addEventListener("change", render));
  document.getElementById("search").addEventListener("input", render);

  function paymentHistory(l) {
    const pays = MOCK.liabilityPayments[l.id];
    if (!pays) return "";
    const totalInterest = pays.reduce((s, p) => s + p.interest, 0);
    return `
      <details class="mt-4 text-xs">
        <summary class="cursor-pointer text-slate-500 font-medium">Payment history · ${App.fmtMoney(totalInterest, l.currency)} interest across ${pays.length} recorded payments</summary>
        <table class="w-full mt-2">
          <thead><tr class="text-slate-400"><th class="text-left font-medium py-1">Date</th><th class="text-right font-medium">Principal</th><th class="text-right font-medium">Interest</th><th class="text-right font-medium">Total</th></tr></thead>
          <tbody>${pays.map(p => `<tr class="border-t border-slate-100"><td class="py-1.5">${App.fmtDate(p.date)}</td><td class="text-right">${App.fmtMoney(p.principal, l.currency)}</td><td class="text-right text-slate-500">${App.fmtMoney(p.interest, l.currency)}</td><td class="text-right font-medium">${App.fmtMoney(p.principal + p.interest, l.currency)}</td></tr>`).join("")}</tbody>
        </table>
      </details>`;
  }
</script>
</body>
</html>
