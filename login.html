<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · Johaan's Future</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-teal-700 text-white flex items-center justify-center font-bold text-lg mb-3">JF</div>
      <h1 class="text-lg font-semibold">Johaan's Future</h1>
      <p class="text-sm text-slate-500">Personal Wealth &amp; Finance Manager</p>
    </div>

    <div class="card p-6 shadow-sm">
      <form data-mock-form="Signed in (prototype)." onsubmit="window.location.href='dashboard.html'; return false;" class="space-y-4">
        <div>
          <label class="text-xs font-medium text-slate-600">Email</label>
          <input type="email" value="vishnu.viswanath.mm@gmail.com" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-teal-600/30 focus:border-teal-600" />
        </div>
        <div>
          <label class="text-xs font-medium text-slate-600">Password</label>
          <input type="password" value="••••••••••" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-teal-600/30 focus:border-teal-600" />
        </div>
        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-2 text-slate-500"><input type="checkbox" checked class="rounded border-slate-300" /> Remember me</label>
          <a href="#" onclick="document.getElementById('reset-panel').classList.toggle('hidden'); return false;" class="text-teal-700 font-medium">Forgot password?</a>
        </div>
        <button class="w-full bg-teal-700 hover:bg-teal-800 text-white text-sm font-medium rounded-lg py-2.5">Sign in</button>
      </form>
    </div>

    <div id="reset-panel" class="hidden card p-6 shadow-sm mt-4">
      <p class="text-sm font-semibold mb-1">Reset your password</p>
      <p class="text-xs text-slate-500 mb-3">We'll email a one-time reset link (Django's built-in password reset).</p>
      <form onsubmit="this.innerHTML = '<p class=&quot;text-sm text-emerald-700&quot;>If that email has an account, a reset link is on its way.</p>'; return false;" class="flex gap-2">
        <input type="email" required placeholder="you@example.com" class="flex-1 border border-slate-200 rounded-lg px-3 py-2 text-sm" />
        <button class="bg-teal-700 text-white text-sm font-medium rounded-lg px-4">Send</button>
      </form>
    </div>

    <p class="text-xs text-center text-slate-400 mt-6">Prototype UI — no real authentication. All data on this site is mocked.</p>
    <p class="text-xs text-center text-slate-400 mt-1"><a href="dashboard.html" class="text-teal-700 font-medium">Skip straight to dashboard →</a></p>
  </div>
</body>
</html>
